<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Logo -->
  <img src="logo.png" alt="Logo Spotify">
  <!-- Frase inicial -->
  <header>
    <h1>Olá de novo</h1>
  </header>

  <main>
    <form action="#" method="POST"> <!-- action="#" achado esse metodo na IA para nao precisa fazer um pagina, somente recarrega -->
      <label for="email"><strong>E-mail</strong></label>
      <input type="email" id="email" placeholder="Digite seu e-mail" required>
      
      <button type="submit">Continuar</button>
    </form>

    <p>Ou</p>
    <!-- Botões de tipos diferentes de login -->
    <button type="button" class="btn-social">
      <img src="telefone.png" alt="Telefone" class="icone">
      <span>Continuar com um número de telefone</span>
    </button>
    <button type="button" class="btn-social">
      <img src="google.png" alt="Google" class="icone">
      <span>Continuar com Google</span>
    </button>
    <button type="button" class="btn-social">
      <img src="facebook.png" alt="Facebook" class="icone">   <!-- Colocado as logos dentros dos 4 botões -->
      <span>Continuar com Facebook</span>
    </button>
    <button type="button" class="btn-social">
      <img src="apple.png" alt="Apple" class="icone">
      <span>Continuar com Apple</span>
    </button>
    <!-- Criar conta -->
    <p>Não tem conta?</p>
    <button type="button"><strong>Inscreva-se</strong></button>
    <!-- Termos de serviço) -->
    <footer class="rodape">
    <p>Este site é protegido pelo reCAPTCHA e está sujeito à<br>   <!-- Ajustado frase de termos de serviço -->
    <a href="#">Política de Privacidade</a> e aos <a href="#">Termos de Serviço</a> do Google.</p>
  </footer>

  </main>

</body>
</html>
